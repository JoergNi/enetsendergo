name: "eNet Sender Go"
description: "Bridges eNet smart home bus to a REST API for Home Assistant (Go)"
version: "2.0.7"
slug: "enetsender"
image: "ghcr.io/joergni/enetsender"
init: false
arch:
  - aarch64
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:8080]/health"
host_network: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "eNet REST API"
options:
  enet_host: "192.168.178.34"
  enet_port: 9050
  axiom_dataset: ""
  axiom_api_token: ""
schema:
  enet_host: str
  enet_port: int
  axiom_dataset: "str?"
  axiom_api_token: "str?"
